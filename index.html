<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Tech Glassmorphism Interface</title>
    <style>
        :root {
            --bg-primary: #030712;
            --glass-bg: rgba(15, 23, 42, 0.45);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shine: rgba(255, 255, 255, 0.25);
            --neon-blue: #00f0ff;
            --neon-purple: #7000ff;
            --neon-pink: #ff007f;
            --neon-green: #00ff88;
            --neon-gold: #ffaa00;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .ambient-glow {
            position: fixed;
            width: 700px;
            height: 700px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.15) 0%, rgba(112, 0, 255, 0.12) 40%, rgba(0, 0, 0, 0) 70%);
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            filter: blur(90px);
            z-index: 0;
            animation: pulseGlow 8s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: translateX(-50%) scale(1); opacity: 0.6; }
            100% { transform: translateX(-50%) scale(1.3); opacity: 0.95; }
        }

        .main-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1200px;
            padding: 2rem 1.5rem 4rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .top-price-hero {
            position: relative;
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(200%);
            -webkit-backdrop-filter: blur(25px) saturate(200%);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2),
                        0 0 40px rgba(0, 240, 255, 0.1);
            overflow: hidden;
            transform-style: preserve-3d;
            perspective: 1000px;
            transition: transform 0.1s ease, box-shadow 0.3s ease;
        }

        .top-price-hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 45%,
                rgba(255, 255, 255, 0.08) 50%,
                transparent 55%
            );
            animation: sweepShimmer 6s infinite linear;
            pointer-events: none;
        }

        @keyframes sweepShimmer {
            0% { transform: translate(-30%, -30%) rotate(0deg); }
            100% { transform: translate(30%, 30%) rotate(360deg); }
        }

        .top-price-hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), var(--neon-purple), transparent);
            animation: scanBorder 3s infinite ease-in-out;
        }

        @keyframes scanBorder {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .price-info-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            z-index: 2;
        }

        .price-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 1rem;
            border-radius: 50px;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.3);
            width: fit-content;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            background-color: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-green);
            animation: blink 1.5s infinite alternate;
        }

        @keyframes blink {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .badge-text {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--neon-blue);
            text-transform: uppercase;
        }

        .price-display-container {
            display: flex;
            align-items: baseline;
            gap: 0.75rem;
            margin-top: 0.25rem;
        }

        .price-amount {
            font-size: 4.5rem;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ffffff 0%, var(--neon-blue) 50%, var(--neon-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 25px rgba(0, 240, 255, 0.3);
            position: relative;
        }

        .price-currency {
            font-size: 2rem;
            font-weight: 800;
            color: var(--neon-blue);
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
            letter-spacing: 1px;
        }

        .hero-controls {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            z-index: 2;
        }

        .action-btn-primary {
            position: relative;
            padding: 1rem 2.2rem;
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border: none;
            border-radius: 14px;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(112, 0, 255, 0.4),
                        0 0 15px rgba(0, 240, 255, 0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .action-btn-primary:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 15px 35px rgba(112, 0, 255, 0.6),
                        0 0 25px rgba(0, 240, 255, 0.6);
        }

        .action-btn-primary:active {
            transform: translateY(1px) scale(0.98);
        }

        .action-btn-secondary {
            position: relative;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .action-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
            width: 100%;
        }

        .glass-card {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.75rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            overflow: hidden;
        }

        .glass-card:hover {
            transform: translateY(-8px);
            border-color: rgba(0, 240, 255, 0.4);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5),
                        0 0 30px rgba(0, 240, 255, 0.2);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .card-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--neon-blue);
            font-size: 1.2rem;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.05);
        }

        .card-value {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .card-subtext {
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .trend-up {
            color: var(--neon-green);
            font-weight: 600;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 75%;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            border-radius: 10px;
            position: relative;
            box-shadow: 0 0 12px var(--neon-blue);
            animation: fillGlow 2s infinite alternate ease-in-out;
        }

        @keyframes fillGlow {
            0% { filter: brightness(1); }
            100% { filter: brightness(1.4); }
        }

        .bottom-slogan-section {
            position: relative;
            width: 100%;
            margin-top: 1rem;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(30px) saturate(210%);
            -webkit-backdrop-filter: blur(30px) saturate(210%);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 1.5rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                        0 0 30px rgba(112, 0, 255, 0.15),
                        inset 0 1px 0 rgba(255, 255, 255, 0.3);
            overflow: hidden;
        }

        .bottom-slogan-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.15), transparent);
            animation: linePass 4s infinite linear;
        }

        @keyframes linePass {
            0% { left: -100%; }
            100% { left: 200%; }
        }

        .slogan-title-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            z-index: 2;
        }

        .slogan-main-text {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, var(--neon-blue) 60%, var(--neon-green) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            text-shadow: 0 5px 15px rgba(0, 240, 255, 0.2);
        }

        .slogan-sub-text {
            font-size: 1rem;
            color: var(--text-muted);
            max-width: 650px;
            line-height: 1.6;
        }

        .download-btn-wrapper {
            position: relative;
            z-index: 2;
        }

        .download-slogan-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            padding: 1.1rem 2.5rem;
            font-size: 1.15rem;
            font-weight: 800;
            color: #ffffff;
            text-decoration: none;
            background: linear-gradient(135deg, #00f0ff 0%, #7000ff 50%, #ff007f 100%);
            background-size: 200% 200%;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0, 240, 255, 0.35),
                        0 0 20px rgba(112, 0, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: gradientShift 4s ease infinite alternate;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .download-slogan-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 45px rgba(0, 240, 255, 0.6),
                        0 0 35px rgba(255, 0, 127, 0.5);
            border-color: #ffffff;
        }

        .download-slogan-btn:active {
            transform: translateY(-1px) scale(0.98);
        }

        .download-icon-anim {
            display: inline-block;
            font-size: 1.3rem;
            animation: bounceDown 1.5s infinite ease-in-out;
        }

        @keyframes bounceDown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(4px); }
        }

        .interactive-glow-box {
            position: absolute;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.25) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1;
        }

        @media (max-width: 768px) {
            .top-price-hero {
                flex-direction: column;
                align-items: flex-start;
                gap: 1.5rem;
                padding: 2rem;
            }

            .hero-controls {
                width: 100%;
                justify-content: flex-start;
            }

            .price-amount {
                font-size: 3.2rem;
            }

            .slogan-main-text {
                font-size: 1.4rem;
            }

            .download-slogan-btn {
                padding: 0.9rem 1.8rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>
    <div class="ambient-glow"></div>

    <div class="main-wrapper">
        
        <div class="top-price-hero" id="hero-card">
            <div class="interactive-glow-box" id="hero-glow"></div>
            
            <div class="price-info-group">
                <div class="price-badge">
                    <span class="badge-dot"></span>
                    <span class="badge-text">LIVE VALUATION</span>
                </div>
                <div class="price-display-container">
                    <span class="price-amount" id="counter-price">0</span>
                    <span class="price-currency">UST</span>
                </div>
            </div>

            <div class="hero-controls">
                <button class="action-btn-primary" id="btn-buy">PURCHASE NOW</button>
                <button class="action-btn-secondary" id="btn-details">DETAILS</button>
            </div>
        </div>

        <div class="grid-container">
            
            <div class="glass-card">
                <div class="card-header">
                    <span class="card-title">24H VOLUME</span>
                    <div class="card-icon">⚡</div>
                </div>
                <div class="card-value">$4,829,100</div>
                <div class="card-subtext">
                    <span class="trend-up">+14.2%</span> VS LAST 24 HOURS
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" style="width: 82%;"></div>
                </div>
            </div>

            <div class="glass-card">
                <div class="card-header">
                    <span class="card-title">NETWORK HEALTH</span>
                    <div class="card-icon">🛡️</div>
                </div>
                <div class="card-value">99.98%</div>
                <div class="card-subtext">
                    <span class="trend-up">OPTIMAL</span> LATENCY 12MS
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" style="width: 99%; background: linear-gradient(90deg, var(--neon-green), var(--neon-blue));"></div>
                </div>
            </div>

            <div class="glass-card">
                <div class="card-header">
                    <span class="card-title">TOTAL LIQUIDITY</span>
                    <div class="card-icon">💎</div>
                </div>
                <div class="card-value">850,000 UST</div>
                <div class="card-subtext">
                    <span class="trend-up">+8.5%</span> STAKING POOL
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" style="width: 64%; background: linear-gradient(90deg, var(--neon-purple), var(--neon-pink));"></div>
                </div>
            </div>

        </div>

        <div class="bottom-slogan-section">
            <div class="slogan-title-group">
                <div class="slogan-main-text">下載詳細內容</div>
                <div class="slogan-sub-text">獲取完整系統規格說明文件與完整帳號數據資料</div>
            </div>

            <div class="download-btn-wrapper">
                <a href="https://raw.githubusercontent.com/8nkl/Brawl-Stars-Account/main/6.pdf" target="_blank" rel="noopener noreferrer" class="download-slogan-btn">
                    <span class="download-icon-anim">📥</span>
                    <span>下載詳細內容文件 (PDF)</span>
                </a>
            </div>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        const particleCount = 60;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.6;
                this.speedY = (Math.random() - 0.5) * 0.6;
                this.alpha = Math.random() * 0.5 + 0.2;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 240, 255, ${this.alpha})`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00f0ff';
                ctx.fill();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function connectParticles() {
            for (let a = 0; a < particles.length; a++) {
                for (let b = a; b < particles.length; b++) {
                    const dx = particles[a].x - particles[b].x;
                    const dy = particles[a].y - particles[b].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 130) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(0, 240, 255, ${0.15 - distance / 1000})`;
                        ctx.lineWidth = 0.8;
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            connectParticles();
            requestAnimationFrame(animateParticles);
        }

        animateParticles();

        const priceElement = document.getElementById('counter-price');
        const targetPrice = 1500;
        const duration = 2000;
        const frameRate = 60;
        const totalFrames = Math.round((duration / 1000) * frameRate);
        let currentFrame = 0;

        function animatePriceCounter() {
            const progress = currentFrame / totalFrames;
            const easeOutQuad = 1 - (1 - progress) * (1 - progress);
            const currentPrice = Math.round(targetPrice * easeOutQuad);
            
            priceElement.innerText = currentPrice.toLocaleString();

            if (currentFrame < totalFrames) {
                currentFrame++;
                requestAnimationFrame(animatePriceCounter);
            } else {
                priceElement.innerText = targetPrice.toLocaleString();
            }
        }

        setTimeout(animatePriceCounter, 300);

        const heroCard = document.getElementById('hero-card');
        const heroGlow = document.getElementById('hero-glow');

        heroCard.addEventListener('mousemove', (e) => {
            const rect = heroCard.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            const rotateX = (y - centerY) / 20;
            const rotateY = (centerX - x) / 20;

            heroCard.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.01, 1.01, 1.01)`;
            
            heroGlow.style.left = `${x}px`;
            heroGlow.style.top = `${y}px`;
            heroGlow.style.opacity = '1';
        });

        heroCard.addEventListener('mouseleave', () => {
            heroCard.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
            heroGlow.style.opacity = '0';
        });

        const cards = document.querySelectorAll('.glass-card');
        cards.forEach(card => {
            card.addEventListener('mouseenter', () => {
                card.style.transition = 'all 0.2s ease';
            });
            card.addEventListener('mouseleave', () => {
                card.style.transition = 'all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1)';
            });
        });
    </script>
</body>
</html>
