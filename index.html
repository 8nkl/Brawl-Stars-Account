<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Brawl Stars $1500 VIP Asset Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary-yellow: #ffcc00;
  --secondary-yellow: #ff9900;
  --brawl-blue: #00c3ff;
  --brawl-purple: #8a2be2;
  --brawl-dark-purple: #1a0933;
  --brawl-pink: #ff007f;
  --brawl-green: #00ff66;
  --glass-bg: rgba(20, 10, 35, 0.6);
  --glass-border: rgba(255, 255, 255, 0.25);
  --glass-glow: rgba(0, 195, 255, 0.4);
  --text-shadow: 3px 3px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  font-family: 'Luckiest Guy', 'Noto Sans TC', sans-serif;
}

body {
  background: radial-gradient(circle at center, #2d124d 0%, #0d031a 100%);
  color: #ffffff;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  position: relative;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
  padding-left: var(--safe-left);
  padding-right: var(--safe-right);
}

#particle-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 1;
  pointer-events: none;
}

.bg-effects {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
  background: 
    radial-gradient(circle at 20% 20%, rgba(255, 204, 0, 0.15) 0%, transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(138, 43, 226, 0.25) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(0, 195, 255, 0.1) 0%, transparent 60%);
  animation: pulseBg 8s ease-in-out infinite alternate;
}

@keyframes pulseBg {
  0% { transform: scale(1); opacity: 0.8; }
  100% { transform: scale(1.08); opacity: 1; }
}

.lang-switch-box {
  position: absolute;
  top: calc(15px + var(--safe-top));
  right: calc(15px + var(--safe-right));
  z-index: 100;
  display: flex;
  gap: 6px;
  background: rgba(0, 0, 0, 0.65);
  padding: 5px;
  border-radius: 14px;
  border: 2px solid var(--glass-border);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.lang-btn {
  background: transparent;
  border: none;
  color: #aaa;
  padding: 6px 14px;
  border-radius: 9px;
  font-size: clamp(0.75rem, 2vw, 0.95rem);
  font-weight: 900;
  cursor: pointer;
  transition: all 0.2s ease;
}

.lang-btn:hover {
  color: #fff;
}

.lang-btn.active {
  background: linear-gradient(180deg, var(--primary-yellow) 0%, var(--secondary-yellow) 100%);
  color: #000;
  box-shadow: 0 4px 10px rgba(255, 204, 0, 0.5);
  border: 1px solid #fff;
}

.app-container {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 1440px;
  margin: 0 auto;
  padding: clamp(60px, 8vh, 90px) clamp(12px, 3vw, 30px) 30px clamp(12px, 3vw, 30px);
}

.header-banner {
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: clamp(2px, 0.4vw, 4px) solid var(--glass-border);
  border-radius: clamp(16px, 3vw, 24px);
  padding: clamp(20px, 4vw, 35px);
  text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 0 20px rgba(255,255,255,0.1);
  transform: skew(-1.5deg);
  margin-bottom: clamp(20px, 4vh, 40px);
  position: relative;
  overflow: hidden;
}

.header-banner::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: linear-gradient(60deg, transparent, rgba(255,255,255,0.15), transparent);
  transform: rotate(30deg);
  animation: shineSweep 6s infinite;
}

@keyframes shineSweep {
  0% { transform: translateX(-100%) rotate(30deg); }
  20% { transform: translateX(100%) rotate(30deg); }
  100% { transform: translateX(100%) rotate(30deg); }
}

.title-main {
  font-size: clamp(1.8rem, 5.5vw, 3.8rem);
  color: var(--primary-yellow);
  text-shadow: var(--text-shadow), 0 0 25px rgba(255, 204, 0, 0.6);
  letter-spacing: 1.5px;
  transform: skew(1.5deg);
  animation: bounceTitle 2s ease-in-out infinite alternate;
  word-break: break-word;
}

@keyframes bounceTitle {
  0% { transform: translateY(0) skew(1.5deg); }
  100% { transform: translateY(-6px) skew(1.5deg); }
}

.subtitle-tag {
  display: inline-block;
  background: linear-gradient(90deg, #ff007f, #8a2be2);
  padding: clamp(6px, 1.5vw, 10px) clamp(16px, 3vw, 28px);
  border-radius: 50px;
  font-size: clamp(0.9rem, 2.2vw, 1.3rem);
  font-weight: 900;
  margin-top: 12px;
  border: 2.5px solid #fff;
  box-shadow: 0 8px 15px rgba(0,0,0,0.4);
  transform: skew(1.5deg);
}

.top-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: clamp(15px, 2.5vw, 30px);
  margin-bottom: clamp(20px, 4vh, 40px);
}

.glass-card {
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: clamp(2px, 0.3vw, 3px) solid var(--glass-border);
  border-radius: clamp(14px, 2.5vw, 20px);
  padding: clamp(16px, 3vw, 30px);
  box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 15px rgba(255,255,255,0.05);
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  position: relative;
}

.glass-card:hover {
  transform: translateY(-5px) scale(1.005);
  border-color: var(--brawl-blue);
  box-shadow: 0 20px 40px rgba(0, 195, 255, 0.3), inset 0 0 25px rgba(0, 195, 255, 0.2);
}

.card-header {
  font-size: clamp(1.2rem, 2.8vw, 1.8rem);
  color: var(--brawl-blue);
  text-shadow: var(--text-shadow);
  margin-bottom: 15px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.amount-badge {
  font-size: clamp(2.5rem, 6vw, 3.8rem);
  color: #00ff66;
  text-shadow: var(--text-shadow), 0 0 30px rgba(0, 255, 102, 0.6);
  text-align: center;
  margin: 10px 0;
  animation: glowPulse 1.5s infinite alternate;
}

@keyframes glowPulse {
  0% { text-shadow: var(--text-shadow), 0 0 15px rgba(0, 255, 102, 0.4); }
  100% { text-shadow: var(--text-shadow), 0 0 35px rgba(0, 255, 102, 0.9); }
}

.discord-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: rgba(88, 101, 242, 0.2);
  border: 2px dashed #5865F2;
  border-radius: 16px;
  padding: clamp(15px, 2.5vw, 25px);
}

.discord-tag {
  font-size: clamp(1.4rem, 3.5vw, 2.2rem);
  color: #ffffff;
  background: #5865F2;
  padding: 8px clamp(15px, 3vw, 30px);
  border-radius: 14px;
  border: 3px solid #ffffff;
  box-shadow: 0 6px 0px #36393f, 0 10px 20px rgba(0,0,0,0.5);
  letter-spacing: 1px;
  word-break: break-all;
}

.brawl-btn {
  background: linear-gradient(180deg, var(--primary-yellow) 0%, var(--secondary-yellow) 100%);
  color: #000;
  font-size: clamp(1rem, 2vw, 1.4rem);
  font-weight: 900;
  padding: clamp(10px, 2vw, 14px) clamp(18px, 3vw, 35px);
  border: 3px solid #ffffff;
  border-radius: 14px;
  box-shadow: 0 6px 0px #b36b00, 0 12px 18px rgba(0,0,0,0.4);
  cursor: pointer;
  transition: all 0.1s ease;
  transform: skew(-3deg);
  display: inline-block;
  text-align: center;
  width: 100%;
}

.brawl-btn:hover {
  filter: brightness(1.1);
  transform: skew(-3deg) translateY(-2px);
  box-shadow: 0 8px 0px #b36b00, 0 15px 22px rgba(0,0,0,0.5);
}

.brawl-btn:active {
  transform: skew(-3deg) translateY(4px);
  box-shadow: 0 2px 0px #b36b00, 0 4px 8px rgba(0,0,0,0.4);
}

.stats-container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: clamp(8px, 1.5vw, 15px);
  margin-top: 15px;
}

.stat-item {
  background: rgba(0,0,0,0.45);
  border: 1.5px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  padding: clamp(8px, 1.5vw, 12px);
  text-align: center;
}

.stat-value {
  font-size: clamp(1.1rem, 2.5vw, 1.6rem);
  color: var(--primary-yellow);
  text-shadow: 2px 2px 0 #000;
}

.stat-label {
  font-size: clamp(0.65rem, 1.2vw, 0.85rem);
  color: #aaa;
  margin-top: 2px;
}

.controls-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.search-input {
  flex: 1;
  min-width: 200px;
  width: 100%;
  background: rgba(0,0,0,0.65);
  border: 2.5px solid var(--brawl-blue);
  border-radius: 12px;
  padding: 10px 16px;
  color: #fff;
  font-size: clamp(0.95rem, 1.8vw, 1.15rem);
  outline: none;
  box-shadow: inset 0 3px 6px rgba(0,0,0,0.5);
  transition: all 0.3s;
}

.search-input:focus {
  border-color: var(--primary-yellow);
  box-shadow: inset 0 3px 6px rgba(0,0,0,0.5), 0 0 15px rgba(255, 204, 0, 0.5);
}

.filter-group {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  width: 100%;
}

.filter-btn {
  flex: 1;
  min-width: 70px;
  background: rgba(255,255,255,0.08);
  border: 1.5px solid rgba(255,255,255,0.2);
  color: #fff;
  padding: 7px 12px;
  border-radius: 10px;
  cursor: pointer;
  font-size: clamp(0.75rem, 1.5vw, 0.95rem);
  transition: all 0.2s;
  text-align: center;
  white-space: nowrap;
}

.filter-btn.active, .filter-btn:hover {
  background: var(--brawl-blue);
  border-color: #fff;
  color: #000;
  font-weight: 900;
  box-shadow: 0 4px 10px rgba(0, 195, 255, 0.4);
}

.brawler-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(clamp(95px, 20vw, 135px), 1fr));
  gap: clamp(10px, 2vw, 18px);
}

.brawler-card {
  background: linear-gradient(135deg, rgba(40, 20, 70, 0.85) 0%, rgba(15, 5, 30, 0.95) 100%);
  border: 2.5px solid rgba(255,255,255,0.18);
  border-radius: 14px;
  padding: clamp(8px, 1.5vw, 12px);
  text-align: center;
  position: relative;
  overflow: hidden;
  transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  cursor: pointer;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.brawler-card:hover {
  transform: translateY(-5px) scale(1.04);
  border-color: var(--primary-yellow);
  box-shadow: 0 8px 18px rgba(255, 204, 0, 0.35);
}

.brawler-avatar {
  width: clamp(50px, 11vw, 70px);
  height: clamp(50px, 11vw, 70px);
  margin: 0 auto 6px auto;
  border-radius: 50%;
  background: radial-gradient(circle, var(--brawl-purple) 0%, #110022 100%);
  border: 2.5px solid var(--primary-yellow);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(1.3rem, 3vw, 1.8rem);
  box-shadow: 0 4px 8px rgba(0,0,0,0.5);
  position: relative;
}

.level-badge {
  position: absolute;
  bottom: -5px;
  background: linear-gradient(180deg, #ff0055 0%, #990033 100%);
  color: #fff;
  font-size: clamp(0.55rem, 1.2vw, 0.75rem);
  padding: 1px 6px;
  border-radius: 8px;
  border: 1px solid #fff;
  font-weight: 900;
  text-shadow: 1px 1px 0 #000;
  white-space: nowrap;
}

.brawler-name {
  font-size: clamp(0.8rem, 1.8vw, 1rem);
  color: #fff;
  text-shadow: 1px 1px 0 #000;
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.brawler-rarity {
  font-size: clamp(0.6rem, 1.2vw, 0.72rem);
  color: var(--brawl-blue);
  margin-top: 2px;
}

.toast {
  position: fixed;
  bottom: calc(20px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: linear-gradient(90deg, #00ff66, #00c3ff);
  color: #000;
  padding: 12px 30px;
  border-radius: 50px;
  font-size: clamp(1rem, 2.5vw, 1.25rem);
  font-weight: 900;
  border: 2.5px solid #fff;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  opacity: 0;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  z-index: 9999;
  pointer-events: none;
  white-space: nowrap;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0,0,0,0.82);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s ease;
  padding: 20px;
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.modal-content {
  background: var(--brawl-dark-purple);
  border: 3.5px solid var(--primary-yellow);
  border-radius: 20px;
  padding: clamp(20px, 4vw, 35px);
  max-width: 480px;
  width: 100%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(255, 204, 0, 0.4);
  transform: scale(0.85) translateY(20px);
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.modal-overlay.active .modal-content {
  transform: scale(1) translateY(0);
}

.modal-title {
  font-size: clamp(1.5rem, 4vw, 2.2rem);
  color: var(--primary-yellow);
  text-shadow: var(--text-shadow);
  margin-bottom: 12px;
}

.modal-body {
  font-size: clamp(0.9rem, 2vw, 1.1rem);
  color: #ddd;
  margin-bottom: 20px;
  line-height: 1.6;
}

@media (max-width: 900px) {
  .top-grid {
    grid-template-columns: 1fr;
  }
  .filter-group {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (max-width: 480px) {
  .filter-group {
    grid-template-columns: repeat(2, 1fr);
  }
  .app-container {
    padding-top: calc(75px + var(--safe-top));
  }
}

@media (min-width: 1800px) {
  .app-container {
    max-width: 1650px;
  }
  .brawler-grid {
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  }
}
</style>
</head>

    closeBtn: "CLOSE",
    filterAll: "ALL (109)",
    filterDamage: "DAMAGE",
    filterTank: "TANK",
    filterAssassin: "ASSASSIN",
    filterSupport: "SUPPORT",
    filterMarksman: "MARKSMAN",
    modalIdx: "HERO INDEX:",
    modalLvl: "CURRENT LEVEL:",
    modalRole: "CLASS ROLE:",
    modalHyper: "HYPERCHARGE STATUS:",
    modalHyperVal: "Locked / None",
    modalFooter: "Ready for action in the $1500 full roster package!",
    categories: {

      support: "SUPPORT",
      marksman: "MARKSMAN"
    }
  }
};

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  if (type === 'hover') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.05);
    gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
  } else if (type === 'click') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'success') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.16);
    osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.24);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.38);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.38);
  }
}

const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let dpr = window.devicePixelRatio || 1;

function resizeCanvas() {
  dpr = window.devicePixelRatio || 1;
  const width = window.innerWidth;
  const height = window.innerHeight;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';
  ctx.scale(dpr, dpr);
}

window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => {
  setTimeout(resizeCanvas, 100);
});
resizeCanvas();

class Particle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * window.innerWidth;
    this.y = Math.random() * window.innerHeight;
    this.size = Math.random() * 3.5 + 1;
    this.speedX = (Math.random() - 0.5) * 1.2;
    this.speedY = (Math.random() - 0.5) * 1.2;
    this.color = ['#ffcc00', '#00c3ff', '#8a2be2', '#ff007f'][Math.floor(Math.random() * 4)];
    this.alpha = Math.random() * 0.6 + 0.2;
  }
  update() {
    this.x += this.speedX;
    this.y += this.speedY;
    if (this.x < 0 || this.x > window.innerWidth || this.y < 0 || this.y > window.innerHeight) {
      this.reset();
    }
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

const particleCount = window.innerWidth < 600 ? 35 : 70;
for (let i = 0; i < particleCount; i++) {
  particles.push(new Particle());
}

function animateParticles() {
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  particles.forEach(p => {
    p.update();
    p.draw();
  });
  requestAnimationFrame(animateParticles);
}
animateParticles();

const brawlerCategories = ['damage', 'tank', 'assassin', 'support', 'marksman'];
const brawlerIcons = ['💀', '🛡️', '🗡️', '💖', '🎯', '🔥', '⚡', '💣', '👾', '🌟'];
const brawlerNamesBase = [
  'Shelly', 'Nita', 'Colt', 'Bull', 'Brock', 'El Primo', 'Barley', 'Poco', 'Rosa',
  'Rico', 'Darryl', 'Penny', 'Carl', 'Jacky', 'Gus', 'Piper', 'Pam', 'Frank', 'Bibi',
  'Bea', 'Nani', 'Edgar', 'Griff', 'Grom', 'Bonnie', 'Gale', 'Colette', 'Lou', 'Ruffs',
  'Belle', 'Buzz', 'Fang', 'Eve', 'Janet', 'Otis', 'Sam', 'Buster', 'Mandy', 'R-T',
  'Willow', 'Hank', 'Cordelius', 'Pearl', 'Maisie', 'Clancy', 'Moe', 'Kenji', 'Draco'
];

let brawlersData = [];
for (let i = 1; i <= 109; i++) {
  const baseName = brawlerNamesBase[(i - 1) % brawlerNamesBase.length];
  const name = i > brawlerNamesBase.length ? `${baseName} MK-${Math.floor(i / brawlerNamesBase.length) + 1}` : baseName;
  const category = brawlerCategories[i % brawlerCategories.length];
  const icon = brawlerIcons[i % brawlerIcons.length];
  brawlersData.push({
    id: i,
    name: name,
    category: category,
    icon: icon,
    level: 11
  });
}

const brawlerGrid = document.getElementById('brawler-grid');
const searchInput = document.getElementById('search-input');
const filterBtns = document.querySelectorAll('.filter-btn');

function renderBrawlers(data) {
  brawlerGrid.innerHTML = '';
  data.forEach(item => {
    const card = document.createElement('div');
    card.className = 'brawler-card';
    card.innerHTML = `
      <div class="brawler-avatar">
        ${item.icon}
        <div class="level-badge">LVL ${item.level}</div>
      </div>
      <div class="brawler-name">${item.name}</div>
      <div class="brawler-rarity">${i18n[currentLang].categories[item.category]}</div>
    `;
    
    card.addEventListener('mouseenter', () => playSound('hover'));
    card.addEventListener('click', () => {
      playSound('click');
      openModal(item);
    });
    
    brawlerGrid.appendChild(card);
  });
}

let currentFilter = 'all';

function filterData() {
  const query = searchInput.value.toLowerCase().trim();
  const filtered = brawlersData.filter(item => {
    const matchesFilter = currentFilter === 'all' || item.category === currentFilter;
    const matchesSearch = item.name.toLowerCase().includes(query) || item.id.toString().includes(query);
    return matchesFilter && matchesSearch;
  });
  renderBrawlers(filtered);
}

filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    playSound('click');
    filterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.getAttribute('data-filter');
    filterData();
  });
});

searchInput.addEventListener('input', () => {
  filterData();
});

const langTwBtn = document.getElementById('lang-tw-btn');
const langEnBtn = document.getElementById('lang-en-btn');

function applyLanguage(lang) {
  currentLang = lang;
  const text = i18n[lang];

  document.getElementById('ui-title').innerText = text.title;
  document.getElementById('ui-subtitle').innerText = text.subtitle;
  document.getElementById('ui-asset-title').innerText = text.assetTitle;
  document.getElementById('ui-asset-sub').innerText = text.assetSub;
  document.getElementById('ui-stat-brawlers').innerText = text.statBrawlers;
  document.getElementById('ui-stat-grade').innerText = text.statGrade;
  document.getElementById('ui-stat-hyper').innerText = text.statHyper;
  document.getElementById('ui-discord-title').innerText = text.discordTitle;
  document.getElementById('ui-discord-sub').innerText = text.discordSub;
  document.getElementById('copy-btn').innerText = text.copyBtn;
  document.getElementById('search-input').placeholder = text.searchPlaceholder;
  document.getElementById('toast-msg').innerText = text.copiedToast;
  document.getElementById('modal-close-btn').innerText = text.closeBtn;

  document.getElementById('filter-all').innerText = text.filterAll;
  document.getElementById('filter-damage').innerText = text.filterDamage;
  document.getElementById('filter-tank').innerText = text.filterTank;
  document.getElementById('filter-assassin').innerText = text.filterAssassin;
  document.getElementById('filter-support').innerText = text.filterSupport;
  document.getElementById('filter-marksman').innerText = text.filterMarksman;

  if (lang === 'tw') {
    langTwBtn.classList.add('active');
    langEnBtn.classList.remove('active');
  } else {
    langEnBtn.classList.add('active');
    langTwBtn.classList.remove('active');
  }

  filterData();
}

langTwBtn.addEventListener('click', () => {
  playSound('click');
  applyLanguage('tw');
});

langEnBtn.addEventListener('click', () => {
  playSound('click');
  applyLanguage('en');
});

const copyBtn = document.getElementById('copy-btn');
const toast = document.getElementById('toast-msg');

copyBtn.addEventListener('click', () => {
  playSound('success');
  navigator.clipboard.writeText('tw_.8nkl').then(() => {
    toast.classList.add('show');
    setTimeout(() => {
      toast.classList.remove('show');
    }, 2500);
  });
});

const modalOverlay = document.getElementById('modal-overlay');
const modalTitle = document.getElementById('modal-brawler-name');
const modalInfo = document.getElementById('modal-brawler-info');
const modalCloseBtn = document.getElementById('modal-close-btn');

function openModal(brawler) {
  const text = i18n[currentLang];
  modalTitle.innerText = `${brawler.icon} ${brawler.name}`;
  modalInfo.innerHTML = `
    <p><strong>${text.modalIdx}</strong> #${brawler.id}</p>
    <p><strong>${text.modalLvl}</strong> Level ${brawler.level} (MAX)</p>
    <p><strong>${text.modalRole}</strong> ${text.categories[brawler.category]}</p>
    <p><strong>${text.modalHyper}</strong> ${text.modalHyperVal}</p>
    <p style="margin-top:15px; color: var(--primary-yellow);">${text.modalFooter}</p>
  `;
  modalOverlay.classList.add('active');
}

modalCloseBtn.addEventListener('click', () => {
  playSound('click');
  modalOverlay.classList.remove('active');
});

modalOverlay.addEventListener('click', (e) => {
  if (e.target === modalOverlay) {
    playSound('click');
    modalOverlay.classList.remove('active');
  }
});

applyLanguage('tw');
</script>
